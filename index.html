<style>
:root {
  /* 벽에 걸린 일력 한 장이 주인공. 어느 화면에서든 한 줄로 내려가고, 일력 안은 가운데 정렬, 그 밖은 왼쪽 정렬한 달력 칸. */
  --paper: #ffffff;
  --ink: #17191c;
  --muted: #59616b;
  --rule: #cdd2d9;
  --field: #eef1f6;
  --sat: #1f4fd0; /* 달력의 토요일 */
  --sun: #d92b2b; /* 달력의 일요일과 빨간 날 */
  --font-num: "Abril Fatface", "Bodoni 72", Didot, "Bodoni MT", "Times New Roman", serif;
  --font-text: "Gowun Batang", "Noto Serif KR", AppleMyungjo, "Nanum Myeongjo", Batang, serif;
  --num-max: clamp(84px, 26vw, 120px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15171b;
    --ink: #f1f2f4;
    --muted: #a4abb5;
    --rule: #3b4149;
    --field: #23272e;
    --sat: #86acff;
    --sun: #ff7468;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15171b;
  --ink: #f1f2f4;
  --muted: #a4abb5;
  --rule: #3b4149;
  --field: #23272e;
  --sat: #86acff;
  --sun: #ff7468;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 17px;
  line-height: 1.65;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul, dl, dd, fieldset { margin: 0; padding: 0; }
fieldset { border: 0; min-width: 0; }
ul { list-style: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sat); outline-offset: 2px; }
.sr {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}

/* ---------- 잠금 화면 ---------- */
.lock { max-width: 592px; margin: 0 auto; padding: 28px 16px 72px; display: grid; gap: 20px; overflow: hidden; }
.lock[hidden], #app[hidden] { display: none; }
.lock.is-waiting { visibility: hidden; }
.lock-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.lock-title h1 { font-size: 30px; line-height: 1.25; font-weight: 700; }
.lock-by { font-size: 15px; font-weight: 700; white-space: nowrap; }
.lock-sheet { border: 2px solid var(--ink); border-top: 0; background: var(--paper); transform-origin: 10% 0; }
.lock-bind { position: relative; height: 18px; background: var(--ink); }
.lock-bind::after {
  content: "";
  position: absolute; left: 50%; top: 50%;
  width: 8px; height: 8px; margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--paper);
}
.lock-row {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 11px 18px 9px;
  border-bottom: 1px dashed var(--rule);
  font-size: 15px; font-weight: 700;
}
.lock-body { display: grid; gap: 14px; padding: 24px 18px 18px; }
.lock-label { text-align: center; font-size: 17px; }
.lock-body input[type="text"] {
  width: 100%; height: 52px; padding: 0 12px;
  border: 0; border-bottom: 2px solid var(--ink); border-radius: 3px 3px 0 0;
  background: var(--field);
  text-align: center; font-size: 21px; font-weight: 700;
}
.lock-check { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14.5px; color: var(--muted); cursor: pointer; }
.lock-check input { width: 18px; height: 18px; accent-color: var(--ink); }
.lock-btn { height: 52px; border: 0; background: var(--ink); color: var(--paper); font-size: 18px; font-weight: 700; }
.lock-btn:disabled { opacity: 0.6; cursor: default; }
.lock-err { min-height: 1.5em; text-align: center; font-size: 14px; line-height: 1.5; font-weight: 700; color: var(--sun); }
.lock-rights { padding-top: 16px; border-top: 1px solid var(--rule); font-size: 13.5px; line-height: 1.6; color: var(--muted); }
.lock-rights strong { color: var(--ink); }
/* 틀리면 흔들리고, 맞으면 일력 한 장이 뜯겨 나가며 열림 */
.lock-sheet.is-wrong { animation: lock-shake 0.4s; }
.lock-sheet.is-open { animation: lock-tear 0.5s cubic-bezier(0.5, 0, 0.85, 0.5) forwards; }
@keyframes lock-shake {
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
@keyframes lock-tear {
  0% { transform: none; opacity: 1; }
  18% { transform: translateY(3px) rotate(-1deg); opacity: 1; }
  55% { opacity: 1; }
  100% { transform: translateY(40%) rotate(-7deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .lock-sheet.is-wrong, .lock-sheet.is-open { animation: none; }
}
@media (min-width: 1000px) {
  .lock { padding-top: 44px; }
}
</style>
</head>
<body>
<div class="lock" id="lock">
  <header>
    <div class="lock-title">
      <h1>인생시계</h1>
      <p class="lock-by">-뿅글이 제작-</p>
    </div>
  </header>

  <form class="lock-sheet" id="pass" autocomplete="off" novalidate>
    <div class="lock-bind" aria-hidden="true"></div>
    <p class="lock-row"><span>뿅아리 전용</span><span>잠겨 있어요</span></p>
    <div class="lock-body">
      <label class="lock-label" for="pw">뿅글이가 안내한 비밀번호를 적으세요.</label>
      <input id="pw" name="pw" type="text" lang="ko" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" aria-describedby="pw-err">
      <label class="lock-check"><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
      <button class="lock-btn" type="submit" id="unlock-btn">인생시계 열기</button>
      <p class="lock-err" id="pw-err" role="status"></p>
    </div>
  </form>

  <footer class="lock-rights">
    <p><strong>© 2026 뿅글이. All rights reserved.</strong></p>
    <p>이 페이지의 저작권은 뿅글이에게 있습니다. 무단으로 복제하거나 배포하면 법적 조치를 받을 수 있습니다.</p>
  </footer>

  const KEY_STORE = 'ppong-life-clock-key';
  const OPEN_LABEL = '인생시계 열기';

  const $ = (id) => document.getElementById(id);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const canon = (pw) => pw.normalize('NFC').replace(/\s+/g, '');

  async function deriveKey(pw) {
    const material = await crypto.subtle.importKey('raw', enc.encode(canon(pw)), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: fromB64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },
      material, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function decrypt(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(ENC.iv) }, key, fromB64(ENC.data));
    return JSON.parse(dec.decode(plain));
  }
  function remember(kind, raw) { try { (kind === 'local' ? localStorage : sessionStorage).setItem(KEY_STORE, raw); } catch (e) { /* 저장이 막힌 브라우저에서는 매번 입력 */ } }
  function remembered() { try { return localStorage.getItem(KEY_STORE) || sessionStorage.getItem(KEY_STORE); } catch (e) { return null; } }
  function forget() { try { localStorage.removeItem(KEY_STORE); sessionStorage.removeItem(KEY_STORE); } catch (e) { /* 지울 것이 없음 */ } }

  const lock = $('lock'), pass = $('pass'), pw = $('pw'), err = $('pw-err'), btn = $('unlock-btn');

  function run(js) {
    const tag = document.createElement('script');
    tag.textContent = js;
    document.body.appendChild(tag);
    if (window.__lifeClockReady === true) return true;
    try { new Function(js)(); } catch (e) { /* 아래에서 안내 */ }
    return window.__lifeClockReady === true;
  }

  function backToLock(message) {
    $('app').hidden = true;
    lock.hidden = false;
    lock.classList.remove('is-waiting');
    pass.classList.remove('is-open');
    btn.disabled = false;
    btn.textContent = OPEN_LABEL;
    err.textContent = message;
  }

  function open(payload, instant) {
    const show = () => {
      const style = document.createElement('style');
      style.textContent = payload.css;
      document.head.appendChild(style);
      const app = $('app');
      app.innerHTML = payload.html;
      lock.hidden = true;
      app.hidden = false;
      window.scrollTo(0, 0);
      if (!run(payload.js)) {
        backToLock('잠금은 풀렸는데 이 화면에서는 페이지를 띄울 수 없어요. 주소를 브라우저에서 직접 열어 주세요.');
        return;
      }
      const out = $('relock');
      if (out) out.addEventListener('click', () => { forget(); location.reload(); });
    };
    if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { show(); return; }
    pass.classList.add('is-open');
    setTimeout(show, 480);
  }

  pass.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    if (!canon(pw.value)) { err.textContent = '비밀번호를 넣어 주세요.'; pw.focus(); return; }
    if (!window.crypto || !crypto.subtle) { err.textContent = '이 브라우저에서는 열 수 없어요. 크롬이나 사파리 최신 버전으로 열어 주세요.'; return; }
    btn.disabled = true;
    btn.textContent = '확인 중…';
    try {
      const key = await deriveKey(pw.value);
      const payload = await decrypt(key);
      forget();
      remember($('remember').checked ? 'local' : 'session', toB64(await crypto.subtle.exportKey('raw', key)));
      open(payload, false);
    } catch (ex) {
      pass.classList.remove('is-wrong');
      void pass.offsetWidth;
      pass.classList.add('is-wrong');
      err.textContent = '비밀번호가 맞지 않아요. 안내받은 그대로 다시 넣어 주세요.';
      btn.disabled = false;
      btn.textContent = OPEN_LABEL;
      pw.focus();
      pw.select();
    }
  });

  /* 이 기기에서 기억하기를 켜 둔 경우 다시 열 때 바로 해제 */
  (async () => {
    const raw = remembered();
    if (!raw || !window.crypto || !crypto.subtle) return;
    lock.classList.add('is-waiting');
    try {
      const key = await crypto.subtle.importKey('raw', fromB64(raw), { name: 'AES-GCM' }, true, ['decrypt']);
      open(await decrypt(key), true);
    } catch (e) {
      forget();
      lock.classList.remove('is-waiting');
    }
  })();
})();
</script>
</body>
</html>
